name: Check native SKYLOG
on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'lib/**', 'data/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', 'lib/**', 'data/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck && npm run lint && npm run export:native
        working-directory: apps/mobile
